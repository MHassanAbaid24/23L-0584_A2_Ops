name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow needs no secrets.
# Future secrets must be configured in repository Settings → Secrets and variables → Actions,
# then referenced as ${{ secrets.NAME }}; never write secret values in this file.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-serve.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serve.txt
          pip install pytest ruff
          pip install --no-deps -e .
      - run: ruff check src scripts labs tests
      - run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: 23l-0584-a2-ops-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
